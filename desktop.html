<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#37474f">
<meta name="description" content="Escala de turnos 12h dos grupos G1 a G5 - ano inteiro">
<title>RPBC - Tabela de Turno 12H</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2337474f'/%3E%3Crect x='6' y='9' width='20' height='15' rx='2' fill='%23fff'/%3E%3Crect x='6' y='9' width='20' height='4' fill='%231976d2'/%3E%3Crect x='9' y='16' width='4' height='3' fill='%2337474f'/%3E%3Crect x='14' y='16' width='4' height='3' fill='%2337474f'/%3E%3Crect x='19' y='16' width='4' height='3' fill='%23c62828'/%3E%3C/svg%3E">
<style>
:root {
  --escuro:   #37474f;
  --destaque: #1976d2;
  --borda:    #e0e0e0;
  --zebra:    #fafafa;
  --fds:      #eceff1;   /* colunas de sabado e domingo */
  --domingo:  #d32f2f;
  --t-07:     #006064;   /* turno da manha */
  --t-19:     #2e7d32;   /* turno da noite */
  --t-F:      #c62828;   /* folga */
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: #212121;
  background: #eceff1;
  padding: 16px;
}

.app { max-width: 1600px; margin: 0 auto; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .2); }

.topo {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 16px;
  background: var(--escuro);
  color: #fff;
}

.topo h1 { font-size: 17px; font-weight: 500; letter-spacing: .5px; }
.navegacao { display: flex; align-items: center; gap: 10px; }
.navegacao strong { font-size: 19px; min-width: 4ch; text-align: center; }

button {
  font: inherit;
  color: #fff;
  background: none;
  border: 1px solid rgba(255, 255, 255, .3);
  border-radius: 4px;
  padding: 4px 10px;
  cursor: pointer;
}
button:hover { background: rgba(255, 255, 255, .15); }

.rolagem { overflow-x: auto; }

/* ---------------------------------------------------------------- tabela */
.escala { border-collapse: collapse; table-layout: fixed; width: 100%; min-width: 1240px; }

.escala th, .escala td { border: 1px solid var(--borda); text-align: center; height: 21px; }
.escala td { font-size: 11px; }

/* rotulo do mes / do grupo, repetido nas duas pontas da faixa */
.escala tr > th:first-child, .escala tr > th:last-child {
  width: 42px;
  background: var(--escuro);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
}

.semana th { background: var(--fds); color: #546e7a; font-size: 10px; font-weight: 600; }
.semana th.fds { background: #cfd8dc; }

tbody tr:nth-child(even) td { background: var(--zebra); }
td.fds { background: #f0f2f3; }
.dom { color: var(--domingo); }

/* coluna de hoje: faixa vertical que atravessa a tabela inteira, desenhada
   por dentro da celula para nao brigar com o fundo do turno */
.hoje { box-shadow: inset 2px 0 0 var(--destaque), inset -2px 0 0 var(--destaque); }
td.data-hoje { color: var(--destaque); font-weight: 700; }

/* --------------------------------------------------------------- turnos */
.turnos td { font-weight: 700; }
.t-07 { color: var(--t-07); background: #b2dfdb; }
.t-19 { color: var(--t-19); background: #c8e6c9; }
.t-F  { color: var(--t-F);  background: #ffcdd2; }

.turnos tr { cursor: pointer; user-select: none; }
.turnos tr:hover th { background: #546e7a; }

/* com um grupo escolhido, os outros saem de cena */
.escala[data-sel] .turnos tr:not(.sel) td { color: #cfd8dc; background: #fff; }
.turnos tr.sel > th { background: var(--destaque); }

.legenda { display: flex; gap: 18px; padding: 10px 16px; color: #607d8b; font-size: 12px; }
.legenda b { font-weight: 700; }
</style>
</head>
<body>
<div class="app">
  <header class="topo">
    <h1>TABELA DE TURNO 12H</h1>
    <div class="navegacao">
      <button id="anterior" aria-label="Ano anterior">&#9664;</button>
      <strong id="rotuloAno"></strong>
      <button id="proximo" aria-label="Proximo ano">&#9654;</button>
      <button id="btnHoje">Hoje</button>
    </div>
  </header>

  <div class="rolagem"><table class="escala" id="escala"></table></div>

  <p class="legenda">
    <span><b style="color:#006064">07</b> manha</span>
    <span><b style="color:#2e7d32">19</b> noite</span>
    <span><b style="color:#c62828">F</b> folga</span>
    <span>Clique num grupo para destaca-lo. Setas do teclado mudam o ano.</span>
  </p>
</div>

<script>
(() => {
  'use strict';

  // ----------------------------------------------------------- regra
  // G1 inicia em 18/12/2025. Cada grupo entra 2 dias depois do anterior.
  // Ciclo de 10 dias: 2x 07h, 2x 19h, 6x folga.
  const INICIO_G1 = new Date(2025, 11, 18);
  const DEFASAGEM = [0, 2, 4, 6, 8];   // G1..G5
  const CICLO = 10;

  // A semana de 7 dias e o ciclo de 10 voltam a coincidir a cada 70 dias
  // (MMC de 7 e 10). Entao uma unica faixa de 70 colunas serve o ano
  // inteiro: cada coluna tem sempre o mesmo dia da semana e os mesmos
  // turnos. Os meses so mudam de posicao dentro da faixa.
  const COLUNAS = 70;
  const EPOCA = new Date(2025, 11, 15);   // uma segunda-feira: ancora a coluna 0

  const SEMANA = ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'];
  const MESES = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN',
                 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];

  const mod = (a, n) => (a % n + n) % n;
  const maisDias = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);

  // Diferenca em dias de calendario. Passa pelo UTC de proposito: subtrair
  // timestamps locais erra por um dia quando ha mudanca de horario de verao.
  const diasEntre = (de, ate) =>
    Math.round((Date.UTC(ate.getFullYear(), ate.getMonth(), ate.getDate()) -
                Date.UTC(de.getFullYear(), de.getMonth(), de.getDate())) / 864e5);

  const coluna = (d) => mod(diasEntre(EPOCA, d), COLUNAS);

  const turnoDe = (d, defasagem) =>
    [ '07', '07', '19', '19' ][mod(diasEntre(maisDias(INICIO_G1, defasagem), d), CICLO)] || 'F';

  // -------------------------------------------------------- montagem
  const escala = document.getElementById('escala');
  const rotuloAno = document.getElementById('rotuloAno');

  const agora = new Date();
  const HOJE = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());

  let ano = HOJE.getFullYear(), colHoje = -1, grupoSel = '';

  const celulas = (fn) => Array.from({ length: COLUNAS }, (_, c) => fn(c)).join('');

  const classe = (c) => (c % 7 > 4 ? 'fds ' : '') + (c % 7 === 6 ? 'dom ' : '') +
                        (c === colHoje ? 'hoje' : '');

  const faixaSemana = () =>
    `<tr class="semana"><th></th>${celulas((c) => `<th class="${classe(c)}">${SEMANA[c % 7]}</th>`)}<th></th></tr>`;

  const faixaMes = (m) => {
    const dias = Array(COLUNAS).fill('');
    for (let dia = 1, ultimo = new Date(ano, m + 1, 0).getDate(); dia <= ultimo; dia++)
      dias[coluna(new Date(ano, m, dia))] = dia;
    return `<tr><th>${MESES[m]}</th>` + celulas((c) => {
      const eHoje = c === colHoje && dias[c] === HOJE.getDate() && m === HOJE.getMonth();
      return `<td class="${classe(c)}${eHoje ? ' data-hoje' : ''}">${dias[c]}</td>`;
    }) + `<th>${MESES[m]}</th></tr>`;
  };

  const faixaGrupo = (g) => {
    const rotulo = `G${g + 1}`;
    // Qualquer data da coluna serve: o ciclo de 10 dias divide 70 certinho.
    return `<tr data-g="${rotulo}"><th>${rotulo}</th>` + celulas((c) => {
      const t = turnoDe(maisDias(EPOCA, c), DEFASAGEM[g]);
      return `<td class="t-${t}${c === colHoje ? ' hoje' : ''}">${t}</td>`;
    }) + `<th>${rotulo}</th></tr>`;
  };

  const desenhar = () => {
    colHoje = ano === HOJE.getFullYear() ? coluna(HOJE) : -1;
    rotuloAno.textContent = ano;
    escala.innerHTML =
      `<thead>${faixaSemana()}</thead>` +
      `<tbody>${MESES.map((_, m) => faixaMes(m)).join('')}</tbody>` +
      `<tbody class="turnos">${faixaSemana()}${DEFASAGEM.map((_, g) => faixaGrupo(g)).join('')}</tbody>`;
    escala.querySelector(`[data-g="${grupoSel}"]`)?.classList.add('sel');
  };

  // -------------------------------------------------------- eventos
  const mudarAno = (n) => { ano += n; desenhar(); };

  escala.onclick = (e) => {
    const tr = e.target.closest('.turnos tr[data-g]');
    if (!tr) return;
    grupoSel = grupoSel === tr.dataset.g ? '' : tr.dataset.g;
    if (grupoSel) escala.dataset.sel = grupoSel; else delete escala.dataset.sel;
    desenhar();
  };

  document.getElementById('anterior').onclick = () => mudarAno(-1);
  document.getElementById('proximo').onclick = () => mudarAno(1);
  document.getElementById('btnHoje').onclick = () => { ano = HOJE.getFullYear(); desenhar(); };
  document.onkeydown = (e) => {
    if (e.key === 'ArrowLeft') mudarAno(-1);
    if (e.key === 'ArrowRight') mudarAno(1);
  };

  desenhar();
})();
</script>
</body>
</html>
