<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#37474f">
<meta name="description" content="Escala de turnos 12h dos grupos G1 a G5 - RPBC">
<title>RPBC - Tabela de Turnos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2337474f'/%3E%3Crect x='6' y='9' width='20' height='15' rx='2' fill='%23fff'/%3E%3Crect x='6' y='9' width='20' height='4' fill='%231976d2'/%3E%3Crect x='9' y='16' width='4' height='3' fill='%2337474f'/%3E%3Crect x='14' y='16' width='4' height='3' fill='%2337474f'/%3E%3Crect x='19' y='16' width='4' height='3' fill='%23c62828'/%3E%3C/svg%3E">
<style>
/* ================================================================ cores
   Paleta de fundos e bordas. Cor que so aparece em texto fica junto com
   a letra, na secao de tipografia logo abaixo. */
:root {
  --escuro:   #37474f;
  --destaque: #1976d2;   /* grupo escolhido e dia de hoje */
  --sel:      #e3f2fd;   /* celulas do grupo escolhido e de hoje */
  --borda:    #e0e0e0;
  --zebra:    #fafafa;
  --fds:      #eceff1;   /* faixa dos dias da semana e fundo da grade */
}

/* ========================================= tipografia (as duas vistas)
   Familia, tamanho, peso e cor de cada texto moram SO AQUI e valem igual
   na lista (celular em pe) e na grade (deitado / desktop). Para mudar a
   letra de alguma coisa, mude nesta secao. As secoes das vistas, mais
   abaixo, so cuidam de layout (espacamento, largura, fundo, borda) e nao
   tem nenhuma propriedade de fonte - se uma aparecer la, as duas vistas
   voltam a divergir. */

/* texto base: a familia de todo o app e o tamanho do que nao tem regra
   propria (botoes Hoje e das setas, anos e meses do menu) */
body {
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: #212121;
  -webkit-font-smoothing: antialiased;
  /* evita o navegador movel inflar a fonte sozinho na rotacao */
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

/* barra do topo */
.topo  { color: #fff; }
button { font: inherit; color: #fff; }
h1 { font-size: 18px; font-weight: 500; letter-spacing: .5px; }   /* RPBC / TABELA DE TURNO 12H */
.navegacao strong { font-size: 19px; }                            /* ano entre as setas (so na grade) */
button.icone      { font-size: 24px; }                            /* botao do menu (so na lista) */

/* cabecalho da tabela: Data, Dia, G1..G5 na lista; JAN..DEZ, G1..G5 na grade */
.escala th { font-size: 13px; font-weight: 600; color: #fff; }

/* dia da semana: Seg, Ter... na lista; S, T, Q... na grade */
.escala .dia { font-size: 13px; font-weight: 500; color: #546e7a; }

/* dia do mes: 18.12.25 na lista; 18 na grade */
.escala .data { font-size: 13px; font-weight: 500; color: #212121; }

/* turnos: 07 (manha), 19 (noite) e F (folga) */
.turno { font-size: 13px; font-weight: 700; }
.t-07 { color: #006064; }
.t-19 { color: #2e7d32; }
.t-F  { color: #c62828; }

/* fim de semana: o dia da semana e o dia do mes de sabado e domingo. Fica
   depois das regras acima de proposito: na mesma celula, vence. */
.escala .fds { color: #d32f2f; font-weight: 600; }

/* hoje: o dia do mes de hoje. Fica por ultimo: vence ate o fim de semana. */
.escala .data-hoje { color: var(--destaque); font-weight: 700; }

/* com um grupo escolhido, os turnos dos outros grupos apagam */
.escala[data-sel] .turno:not(.sel) { color: #cfd8dc; }

/* ============================================ celulas (as duas vistas)
   Borda, fundo, espacamento e realces das celulas moram SO AQUI e valem
   igual na lista e na grade, como na tipografia: as secoes das vistas
   nao mexem em celula. A unica diferenca proposital e a densidade. */

/* densidade: a lista tem 7 colunas e precisa de linha alta para o dedo;
   a grade tem 72 colunas e precisa caber na tela. E o unico valor de
   celula que muda de uma vista para a outra. */
#retrato  { --celula-espaco: 10px 8px; }
#paisagem { --celula-espaco: 1px 2px; }

/* toda celula */
.escala th, .escala td {
  padding: var(--celula-espaco);
  border: 1px solid var(--borda);
  text-align: center;
  white-space: nowrap;
}

/* rotulos: Data, Dia, G1..G5 na lista; JAN..DEZ, G1..G5 na grade */
.escala th { background: var(--escuro); }

/* faixa dos dias da semana (so na grade) */
.escala th.dia { background: var(--fds); }

/* linhas alternadas */
.escala tbody tr:nth-child(even) { background: var(--zebra); }

/* Realces. Cada um pinta a celula por cima do anterior, entao a ordem
   importa: fim de semana < grupo escolhido < hoje. */

/* fim de semana: as celulas de data e de dia da semana de sabado e domingo */
.escala td.fds { background: #f0f2f3; }
.escala th.fds { background: #cfd8dc; }

/* grupo escolhido: a coluna (lista) ou a linha (grade) dele ganha fundo e
   o rotulo acende. Os turnos dos outros apagam: regra na tipografia. */
.escala td.sel { background: var(--sel); }
.escala th.sel { background: var(--destaque); }

/* hoje: a linha (lista) ou a coluna (grade) de hoje */
.escala td.hoje, .escala th.hoje { background: var(--sel); }

/* rotulo de grupo: clicavel, escolhe o grupo (na grade, a linha inteira) */
.escala .grupo, .escala tr[data-g] { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }

/* so onde existe mouse de verdade: no celular o realce grudaria depois
   do toque. O grupo ja escolhido nao muda de cor. */
@media (hover: hover) {
  .escala .grupo:not(.sel):hover, .escala tr[data-g]:hover > th:not(.sel) { background: #546e7a; }
}

/* ================================================================ comum */
* { box-sizing: border-box; margin: 0; padding: 0; }

button {
  background: none;
  border: 1px solid rgba(255, 255, 255, .3);
  border-radius: 4px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.topo {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--escuro);
}

.escala { width: 100%; border-collapse: collapse; table-layout: fixed; }

@media (hover: hover) { button:hover { background: rgba(255, 255, 255, .15); } }

/* ------------------------------------------------- qual vista aparece
   Em pe: a lista de dias com rolagem infinita. Deitado: a grade com o ano
   inteiro. O JS escuta esta mesma condicao (const `ehRetrato`) para montar
   a vista; se mudar uma, mudar a outra. */
@media (orientation: portrait) {
  html, body {
    height: 100%;
    /* impede o "puxar para atualizar" quando a rolagem infinita chega ao topo */
    overscroll-behavior: none;
    overflow: hidden;
  }
  body { background: #f5f5f5; }
  #paisagem { display: none; }
}

@media (orientation: landscape) {
  /* documento em fluxo normal: numa tela deitada e baixa a grade precisa
     poder rolar nos dois eixos, entao aqui nao vale o overflow:hidden */
  body { background: var(--fds); padding: 16px; }
  #retrato { display: none; }
}

/* ============================================== retrato: lista de dias */
#retrato .app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 600px;
  margin: 0 auto;
  background: #fff;
}

#retrato .topo {
  padding: 12px 16px;
  /* acima do menu: o botao fechar recebe o clique de verdade, em vez de
     depender de acertar o fundo do overlay */
  z-index: 4;
}

#retrato button { padding: 6px 14px; }
#retrato button.icone { border: 0; padding: 0 8px; }
#retrato button.ativo { background: var(--destaque); border-color: var(--destaque); }

#retrato .rolagem {
  flex: 1;
  overflow: hidden auto;
  /* encaixa 1px sob o topo: sem isso sobra uma fresta por onde as linhas
     aparecem entre o cabecalho do app e o cabecalho fixo da tabela */
  margin-top: -1px;
  /* isola a rolagem em vez de encadear no documento */
  overscroll-behavior-y: contain;
  /* barra de rolagem oculta: a rolagem em si continua funcionando */
  scrollbar-width: none;
}

#retrato .rolagem::-webkit-scrollbar { display: none; }

/* com table-layout fixo, as 5 colunas restantes dividem o resto em partes iguais */
#retrato .escala th:first-child { width: 22%; }
#retrato .escala th:nth-child(2) { width: 13%; }

#retrato .escala thead { position: sticky; top: 0; z-index: 1; }

/* ----------------------------------------------------- retrato: menu */
#retrato .menu {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .5);
  z-index: 3;
  display: flex;
  justify-content: center;
  /* comeca abaixo do topo: mantem o botao do menu clicavel e deixa area de
     fundo sobrando para fechar tocando fora */
  align-items: flex-start;
  padding-top: 56px;
}
#retrato .menu[hidden] { display: none; }

#retrato .menu > div {
  width: 100%;
  max-width: 600px;
  max-height: calc(100dvh - 56px);
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
  padding: 16px;
  background: var(--escuro);
  box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
}

#retrato .menu > div::-webkit-scrollbar { display: none; }

#retrato .anos { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }

#retrato .meses {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: repeat(6, auto);
  grid-auto-flow: column;
  gap: 8px;
}

#retrato .meses button { padding: 10px 8px; border-color: rgba(255, 255, 255, .15); }

/* ============================================ paisagem: grade do ano */
#paisagem .app {
  max-width: 1600px;
  margin: 0 auto;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, .2);
}

#paisagem .topo { gap: 16px; padding: 10px 16px; }
#paisagem button { padding: 4px 10px; }

#paisagem .navegacao { display: flex; align-items: center; gap: 10px; }
#paisagem .navegacao strong { min-width: 4ch; text-align: center; }

#paisagem .faixa { overflow-x: auto; }

/* A largura das colunas segue a letra: com layout automatico as 70 colunas
   de dia crescem junto com a fonte dos turnos e dos dias, e a grade passa
   a rolar de lado (dentro da .faixa) quando nao cabe na tela. */
#paisagem .escala { table-layout: auto; }

/* rotulo do mes / do grupo, repetido nas duas pontas da faixa */
#paisagem tr > th:first-child, #paisagem tr > th:last-child { width: 42px; }
</style>
</head>
<body>

<div id="retrato">
  <div class="app">
    <header class="topo">
      <button class="icone" id="btnMenu" aria-label="Abrir menu" aria-expanded="false">&#9776;</button>
      <h1>RPBC</h1>
      <button id="btnHoje">Hoje</button>
    </header>

    <div class="menu" id="menu" hidden>
      <div>
        <div class="anos" id="anos"></div>
        <div class="meses" id="meses"></div>
      </div>
    </div>

    <div class="rolagem" id="rolagem">
      <table class="escala" id="escala">
        <thead>
          <tr>
            <th>Data</th><th>Dia</th>
            <th class="grupo">G1</th><th class="grupo">G2</th><th class="grupo">G3</th>
            <th class="grupo">G4</th><th class="grupo">G5</th>
          </tr>
        </thead>
        <tbody id="corpo"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="paisagem">
  <div class="app">
    <header class="topo">
      <h1>TABELA DE TURNO 12H</h1>
      <div class="navegacao">
        <button id="anterior" aria-label="Ano anterior">&#9664;</button>
        <strong id="rotuloAno"></strong>
        <button id="proximo" aria-label="Proximo ano">&#9654;</button>
        <button id="btnAnoHoje">Hoje</button>
      </div>
    </header>

    <div class="faixa"><table class="escala" id="escalaAno"></table></div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ----------------------------------------------------------- regra
  // G1 inicia em 18/12/2025. Cada grupo entra 2 dias depois do anterior.
  // Ciclo de 10 dias: 2x 07h, 2x 19h, 6x folga.
  // Copia unica: as duas vistas leem daqui, entao nao ha como divergirem.
  const INICIO_G1 = new Date(2025, 11, 18);
  const DEFASAGEM = [0, 2, 4, 6, 8];                       // G1..G5
  const GRUPOS = DEFASAGEM.map((_, i) => `G${i + 1}`);
  const CICLO = 10;

  const DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sab'];   // coluna "Dia"
  const SEMANA = ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'];               // grade, comeca na segunda
  const MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  const MESES_CURTO = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN',
                       'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];

  const mod = (a, n) => (a % n + n) % n;
  const pad = (n) => String(n).padStart(2, '0');
  const maisDias = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);

  // Diferenca em dias de calendario. Passa pelo UTC de proposito: subtrair
  // timestamps locais erra por um dia quando ha mudanca de horario de verao.
  const diasEntre = (de, ate) =>
    Math.round((Date.UTC(ate.getFullYear(), ate.getMonth(), ate.getDate()) -
                Date.UTC(de.getFullYear(), de.getMonth(), de.getDate())) / 864e5);

  const turnoDe = (d, defasagem) => {
    const dia = mod(diasEntre(maisDias(INICIO_G1, defasagem), d), CICLO);
    return dia < 2 ? '07' : dia < 4 ? '19' : 'F';
  };

  const chave = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  const agora = new Date();
  const HOJE = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
  const CHAVE_HOJE = chave(HOJE);

  // Grupo em destaque, compartilhado: escolher na grade e girar o aparelho
  // chega na lista com a mesma coluna realcada.
  let grupoSel = '';

  // ======================================== vista retrato: lista de dias
  const montarRetrato = () => {
    const PAGINA = 30;      // dias carregados por vez
    const LIMIAR = 200;     // px do fim da rolagem que disparam o carregamento
    const ANOS = [-1, 0, 1, 2].map((n) => HOJE.getFullYear() + n);

    const rolagem = document.getElementById('rolagem');
    const escala = document.getElementById('escala');
    const corpo = document.getElementById('corpo');
    const menu = document.getElementById('menu');
    const btnMenu = document.getElementById('btnMenu');

    let inicio, fim, anoSel = HOJE.getFullYear(), ocupado = false;

    const formata = (d) =>
      `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${String(d.getFullYear()).slice(-2)}`;

    // -------------------------------------------------------- montagem
    // As classes das celulas (data, dia, turno, fds, hoje, sel...) sao as
    // mesmas da grade: e por elas que a tipografia e as celulas, regras
    // unicas la no CSS, valem para as duas vistas.
    const linha = (d) => {
      const k = chave(d);
      const hoje = k === CHAVE_HOJE ? ' hoje' : '';
      const fds = d.getDay() === 0 || d.getDay() === 6 ? ' fds' : '';
      const turnos = DEFASAGEM.map((def, g) => {
        const t = turnoDe(d, def);
        return `<td class="turno t-${t}${hoje}${GRUPOS[g] === grupoSel ? ' sel' : ''}">${t}</td>`;
      }).join('');
      return `<tr data-d="${k}">` +
             `<td class="data${fds}${hoje}${hoje ? ' data-hoje' : ''}">${formata(d)}</td>` +
             `<td class="dia${fds}${hoje}">${DIAS[d.getDay()]}</td>` +
             turnos + '</tr>';
    };

    const faixa = (de, ate) => {
      let html = '';
      for (let d = de; d <= ate; d = maisDias(d, 1)) html += linha(d);
      return html;
    };

    // ------------------------------------------------------- paginacao
    const carregarPassado = (n) => {
      const ate = maisDias(inicio, -1);
      const de = maisDias(ate, -(n - 1));
      const alturaAntes = rolagem.scrollHeight;
      const topoAntes = rolagem.scrollTop;

      corpo.insertAdjacentHTML('afterbegin', faixa(de, ate));
      inicio = de;

      // Ler scrollHeight forca o layout aqui mesmo, entao da pra reancorar a
      // rolagem antes do proximo quadro - sem piscada ao inserir linhas acima.
      rolagem.scrollTop = topoAntes + (rolagem.scrollHeight - alturaAntes);
    };

    const carregarFuturo = (n) => {
      const de = maisDias(fim, 1);
      fim = maisDias(de, n - 1);
      corpo.insertAdjacentHTML('beforeend', faixa(de, fim));
    };

    // Carrega o alvo com folga dos dois lados. A folga importa: sem conteudo
    // suficiente abaixo do alvo, o navegador limita a rolagem e a data pedida
    // nunca alcanca o topo da area visivel.
    const garantir = (alvo) => {
      if (alvo < inicio) carregarPassado(diasEntre(alvo, inicio) + PAGINA);
      if (alvo > fim) carregarFuturo(diasEntre(fim, alvo) + PAGINA);
    };

    // ------------------------------------------------------- navegacao
    const irParaHoje = () => {
      fecharMenu();
      const tr = corpo.querySelector('.hoje')?.parentNode;
      if (tr) rolagem.scrollTop = tr.offsetTop - rolagem.clientHeight / 2 + tr.offsetHeight / 2;
    };

    const irParaMes = (mes) => {
      const alvo = new Date(anoSel, mes, 1);
      garantir(alvo);
      fecharMenu();

      const tr = corpo.querySelector(`[data-d="${chave(alvo)}"]`);
      if (!tr) return;

      // offsetTop de um <tr> e relativo a <table>, que comeca no topo da area
      // rolavel - entao serve direto como scrollTop.
      const desejado = tr.offsetTop - tr.offsetHeight;
      rolagem.scrollTop = desejado;

      // Em telas altas pode faltar conteudo abaixo do alvo e a rolagem parar
      // antes dele. Carrega mais e tenta de novo, com um teto de seguranca.
      for (let i = 0; i < 5 && rolagem.scrollTop < desejado; i++) {
        carregarFuturo(PAGINA);
        rolagem.scrollTop = desejado;
      }
    };

    // ------------------------------------------------------------ menu
    const botoes = (destino, itens, ativo, aoClicar) => {
      destino.replaceChildren(...itens.map((rotulo, i) => {
        const b = document.createElement('button');
        if (ativo(i)) b.className = 'ativo';
        b.textContent = rotulo;
        b.onclick = () => aoClicar(i);
        return b;
      }));
    };

    const desenharMenu = () => {
      botoes(document.getElementById('anos'), ANOS,
        (i) => ANOS[i] === anoSel,
        (i) => { anoSel = ANOS[i]; desenharMenu(); });
      botoes(document.getElementById('meses'), MESES,
        (i) => i === HOJE.getMonth() && anoSel === HOJE.getFullYear(),
        irParaMes);
    };

    function alternarMenu(abrir) {
      menu.hidden = !abrir;
      btnMenu.innerHTML = abrir ? '&#10005;' : '&#9776;';
      btnMenu.setAttribute('aria-label', abrir ? 'Fechar menu' : 'Abrir menu');
      btnMenu.setAttribute('aria-expanded', String(abrir));
      rolagem.style.overflowY = abrir ? 'hidden' : 'auto';
      if (abrir) desenharMenu();
    }

    function fecharMenu() { alternarMenu(false); }

    const aplicarGrupo = () => {
      if (grupoSel) escala.dataset.sel = grupoSel; else delete escala.dataset.sel;
      // a classe sel vai em cada celula da coluna: e ela que o CSS realca.
      // Data=0, Dia=1, G1=2 ... G5=6; as linhas carregadas depois ja nascem
      // com ela (ver `linha`).
      const col = grupoSel ? GRUPOS.indexOf(grupoSel) + 2 : -1;
      for (const tr of escala.rows) [...tr.cells].forEach((c, i) => c.classList.toggle('sel', i === col));
    };

    // -------------------------------------------------------- eventos
    rolagem.addEventListener('scroll', () => {
      if (ocupado) return;
      ocupado = true;
      if (rolagem.scrollTop < LIMIAR) carregarPassado(PAGINA);
      if (rolagem.scrollHeight - rolagem.scrollTop - rolagem.clientHeight < LIMIAR) carregarFuturo(PAGINA);
      ocupado = false;
    }, { passive: true });

    btnMenu.onclick = () => alternarMenu(menu.hidden);
    document.getElementById('btnHoje').onclick = irParaHoje;
    menu.onclick = (e) => { if (e.target === menu) fecharMenu(); };

    escala.tHead.onclick = (e) => {
      const th = e.target.closest('th.grupo');
      if (!th) return;
      grupoSel = grupoSel === th.textContent ? '' : th.textContent;
      aplicarGrupo();
    };

    // ---------------------------------------------------------- inicio
    inicio = maisDias(HOJE, -10);
    fim = maisDias(HOJE, 19);
    corpo.innerHTML = faixa(inicio, fim);
    aplicarGrupo();
    // depende de offsetTop/clientHeight, que so valem com a vista visivel -
    // por isso a montagem e preguicosa, feita na primeira vez que ela aparece
    irParaHoje();

    return { aplicarGrupo, tecla: (e) => { if (e.key === 'Escape') fecharMenu(); } };
  };

  // ====================================== vista paisagem: grade do ano
  const montarPaisagem = () => {
    // A semana de 7 dias e o ciclo de 10 voltam a coincidir a cada 70 dias
    // (MMC de 7 e 10). Entao uma unica faixa de 70 colunas serve o ano
    // inteiro: cada coluna tem sempre o mesmo dia da semana e os mesmos
    // turnos. Os meses so mudam de posicao dentro da faixa.
    const COLUNAS = 70;
    const EPOCA = new Date(2025, 11, 15);   // uma segunda-feira: ancora a coluna 0

    const escala = document.getElementById('escalaAno');
    const rotuloAno = document.getElementById('rotuloAno');

    let ano = HOJE.getFullYear(), colHoje = -1;

    const coluna = (d) => mod(diasEntre(EPOCA, d), COLUNAS);
    const celulas = (fn) => Array.from({ length: COLUNAS }, (_, c) => fn(c)).join('');

    const classe = (c) => (c % 7 > 4 ? 'fds ' : '') + (c === colHoje ? 'hoje' : '');

    const faixaSemana = () =>
      `<tr class="semana"><th></th>${celulas((c) => `<th class="dia ${classe(c)}">${SEMANA[c % 7]}</th>`)}<th></th></tr>`;

    const faixaMes = (m) => {
      const dias = Array(COLUNAS).fill('');
      for (let dia = 1, ultimo = new Date(ano, m + 1, 0).getDate(); dia <= ultimo; dia++)
        dias[coluna(new Date(ano, m, dia))] = dia;
      return `<tr><th>${MESES_CURTO[m]}</th>` + celulas((c) => {
        const eHoje = c === colHoje && dias[c] === HOJE.getDate() && m === HOJE.getMonth();
        return `<td class="data ${classe(c)}${eHoje ? ' data-hoje' : ''}">${dias[c]}</td>`;
      }) + `<th>${MESES_CURTO[m]}</th></tr>`;
    };

    const faixaGrupo = (g) => {
      // Qualquer data da coluna serve: o ciclo de 10 dias divide 70 certinho.
      return `<tr data-g="${GRUPOS[g]}"><th class="grupo">${GRUPOS[g]}</th>` + celulas((c) => {
        const t = turnoDe(maisDias(EPOCA, c), DEFASAGEM[g]);
        return `<td class="turno t-${t}${c === colHoje ? ' hoje' : ''}">${t}</td>`;
      }) + `<th class="grupo">${GRUPOS[g]}</th></tr>`;
    };

    const aplicarGrupo = () => {
      // a classe sel vai em cada celula da linha: e ela que o CSS realca
      escala.querySelectorAll('tr[data-g]').forEach((r) => {
        const sel = r.dataset.g === grupoSel;
        for (const c of r.cells) c.classList.toggle('sel', sel);
      });
      if (grupoSel) escala.dataset.sel = grupoSel; else delete escala.dataset.sel;
    };

    const desenhar = () => {
      colHoje = ano === HOJE.getFullYear() ? coluna(HOJE) : -1;
      rotuloAno.textContent = ano;
      escala.innerHTML =
        `<thead>${faixaSemana()}</thead>` +
        `<tbody class="meses">${MESES_CURTO.map((_, m) => faixaMes(m)).join('')}</tbody>` +
        `<tbody class="turnos">${faixaSemana()}${DEFASAGEM.map((_, g) => faixaGrupo(g)).join('')}</tbody>`;
      aplicarGrupo();
    };

    // -------------------------------------------------------- eventos
    const mudarAno = (n) => { ano += n; desenhar(); };

    escala.onclick = (e) => {
      const tr = e.target.closest('.turnos tr[data-g]');
      if (!tr) return;
      grupoSel = grupoSel === tr.dataset.g ? '' : tr.dataset.g;
      aplicarGrupo();
    };

    document.getElementById('anterior').onclick = () => mudarAno(-1);
    document.getElementById('proximo').onclick = () => mudarAno(1);
    document.getElementById('btnAnoHoje').onclick = () => { ano = HOJE.getFullYear(); desenhar(); };

    desenhar();

    return {
      aplicarGrupo,
      tecla: (e) => {
        if (e.key === 'ArrowLeft') mudarAno(-1);
        if (e.key === 'ArrowRight') mudarAno(1);
      },
    };
  };

  // ------------------------------------------------- troca entre vistas
  // Mesma condicao das media queries la em cima: o CSS decide o que aparece,
  // isto aqui decide o que e construido.
  const ehRetrato = matchMedia('(orientation: portrait)');
  const vistas = {};
  let atual = '';

  const trocarVista = () => {
    atual = ehRetrato.matches ? 'retrato' : 'paisagem';
    // Monta so na primeira vez que a vista aparece: remontar perderia onde a
    // pessoa estava. Nas seguintes basta reaplicar o grupo escolhido do outro
    // lado.
    if (vistas[atual]) vistas[atual].aplicarGrupo();
    else vistas[atual] = atual === 'retrato' ? montarRetrato() : montarPaisagem();
  };

  // um handler so: as duas vistas disputavam document.onkeydown
  document.onkeydown = (e) => vistas[atual].tecla(e);

  ehRetrato.addEventListener('change', trocarVista);
  trocarVista();
})();
</script>
</body>
</html>
